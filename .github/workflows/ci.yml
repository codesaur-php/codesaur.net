# ======================================================================
# CI - Code Quality Checks
# ======================================================================
#
# Push болон pull request бүрт код чанарын шалгалт хийнэ.
#
# Шалгалтууд:
#   - composer.json validation
#   - PHP syntax check
#   - Merge conflict markers
#   - Debug statements (var_dump, dd, print_r)
#   - Autoload verification
# ======================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, intl, pdo_mysql

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction

      - name: PHP syntax check
        run: find application public_html -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check for merge conflict markers
        run: |
          if grep -rn "^<<<<<<< \|^=======$\|^>>>>>>> " --include="*.php" --include="*.html" --include="*.js" --include="*.css" --include="*.json" --include="*.yml" application public_html; then
            echo "::error::Merge conflict markers found!"
            exit 1
          fi

      - name: Check for debug statements
        run: |
          if grep -rn "\bvar_dump\b\|\bdd\b\|\bprint_r\b" --include="*.php" application; then
            echo "::warning::Debug statements detected. Please review before deploying."
          fi

      - name: Verify autoload
        run: composer dump-autoload --optimize --strict-psr

  # --------------------------------------------------------------------
  # Promote - шалгалт давсан main commit-ийг `production` салбар руу шилжүүлнэ.
  # Сервер (компанийн VPN дотор, гаднаас хүрэхгүй) энэ салбарыг минут тутам
  # SSH deploy key-ээр татаж release хэлбэрээр deploy хийнэ.
  # force=false: зөвхөн fast-forward - хожуу дууссан хуучин CI шинэ commit-ийг
  # буцааж дарахгүй.
  #
  # Critical (English): production must only move forward to a commit whose
  # checks passed. Keep force=false so a slower, older run can never roll the
  # branch back over a newer promoted commit.
  # --------------------------------------------------------------------
  promote:
    name: Promote to production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false

    steps:
      - name: Fast-forward production branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          if gh api "repos/$REPO/git/ref/heads/production" >/dev/null 2>&1; then
            if gh api -X PATCH "repos/$REPO/git/refs/heads/production" -f sha="$SHA" -F force=false >/dev/null 2>err.txt; then
              echo "production -> $SHA"
            else
              echo "::warning::production was not moved to $SHA (not a fast-forward): $(cat err.txt)"
            fi
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/production -f sha="$SHA" >/dev/null
            echo "production created at $SHA"
          fi
